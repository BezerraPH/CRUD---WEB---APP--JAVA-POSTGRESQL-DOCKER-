<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel de indicadores — lançamento e gestão de dados para Grafana">
    <title th:text="${pageTitle != null ? pageTitle + ' | Indicadores' : 'Indicadores'}">Indicadores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body" th:classappend="${paginaAtiva != null and paginaAtiva != 'inicio'} ? ' has-mobile-nav' : ''">
<a href="#conteudo-principal" class="skip-link">Ir para o conteúdo principal</a>

<header class="app-header" role="banner">
    <div class="app-header-inner app-container">
        <div class="app-header-start">
            <button type="button" class="btn btn-app-outline btn-sidebar-toggle"
                    th:if="${paginaAtiva != null and paginaAtiva != 'inicio'}"
                    id="btn-sidebar-toggle"
                    aria-expanded="false"
                    aria-controls="app-sidebar"
                    title="Menu de navegação">
                <span class="visually-hidden">Abrir ou fechar menu</span>
                <span class="btn-sidebar-icon" aria-hidden="true"></span>
            </button>
            <a class="app-brand" th:href="@{/}">
                <span class="app-brand-sub">SFPC · Painel integrado</span>
                Indicadores operacionais
            </a>
        </div>
        <nav class="header-actions" aria-label="Ações do cabeçalho">
            <a th:if="${showNavFormularios != false}" th:href="@{/formularios}" class="btn btn-app-outline">
                Formulários
            </a>
            <a th:if="${paginaAtiva != 'inicio'}" th:href="@{/formularios/novo}" class="btn btn-app-primary d-none d-md-inline-block">
                + Novo
            </a>
        </nav>
    </div>
</header>

<div id="sidebar-overlay" class="sidebar-overlay" hidden aria-hidden="true"></div>

<div class="app-container">
    <div class="app-layout"
         th:classappend="${paginaAtiva == 'inicio'} ? ' app-layout--home' : ' app-layout--sidebar'">
        <aside th:if="${paginaAtiva != 'inicio'}"
               th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <div class="app-content-column">
        <main id="conteudo-principal" class="app-main" role="main">
            <div class="flash-messages" aria-live="polite">
                <div th:if="${sucesso}" class="alert alert-app-success alert-dismissible fade show" role="alert">
                    <span th:text="${sucesso}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                </div>
                <div th:if="${erro}" class="alert alert-app-danger alert-dismissible fade show" role="alert">
                    <strong>Atenção:</strong> <span th:text="${erro}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                </div>
            </div>
            <div th:replace="${content}">Conteúdo</div>
        </main>

        <footer class="app-footer" role="contentinfo">
            PostgreSQL · Grafana · Uso restrito
        </footer>
        </div>
    </div>
</div>

<nav th:if="${paginaAtiva != null and paginaAtiva != 'inicio'}" class="mobile-nav" aria-label="Menu rápido">
    <div class="mobile-nav-inner">
        <a th:href="@{/}" th:classappend="${paginaAtiva == 'inicio'} ? ' active' : ''">Início</a>
        <a th:href="@{/formularios}" th:classappend="${paginaAtiva == 'formularios'} ? ' active' : ''">Lista</a>
        <a th:href="@{/formularios/novo}" th:classappend="${paginaAtiva == 'novo'} ? ' active' : ''">+ Novo</a>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
